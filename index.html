<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 仓库简介翻译 · Repo Description Translator</title>
<style>
  :root {
    --bg: #f6f8fa;
    --card: #ffffff;
    --text: #24292f;
    --muted: #57606a;
    --accent: #0969da;
    --border: #d0d7de;
    --error: #cf222e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .wrap { max-width: 680px; width: 100%; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,.15); }
  button {
    margin-top: 12px;
    padding: 10px 20px;
    font-size: 15px;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .result-block h3 { margin: 0 0 6px; font-size: 15px; }
  .result-block .text { font-size: 15px; line-height: 1.6; }
  .result-block + .result-block { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
  .error { color: var(--error); }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>GitHub 仓库简介翻译</h1>
  <p class="sub">把 GitHub 仓库的英文简介翻译成简体中文（zh-CN）和繁体中文（zh-TW）</p>

  <div class="card">
    <label for="repo">仓库地址</label>
    <input id="repo" type="text" placeholder="例如：facebook/react 或 https://github.com/facebook/react" autocomplete="off">
    <button id="run">翻译</button>
    <p class="hint">说明：通过 GitHub 公开 API 抓取简介，翻译使用 MyMemory 免费接口（无需 API Key，匿名有每日限额）。</p>
  </div>

  <div class="card" id="result" hidden>
    <div class="meta" id="meta"></div>
    <div class="result-block" id="original"></div>
    <div class="result-block" id="zhcn"></div>
    <div class="result-block" id="zhtw"></div>
  </div>
  <div class="card error" id="error" hidden></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function parseRepo(value) {
  value = value.trim();
  if (/^https?:\/\//.test(value)) {
    const parts = new URL(value).pathname.replace(/^\//, "").split("/");
    if (parts.length >= 2) return parts.slice(0, 2).join("/");
    throw new Error("无法解析仓库地址");
  }
  if (value.split("/").length === 2) return value;
  throw new Error("请输入 owner/repo 或完整的 GitHub 仓库链接");
}

async function translate(text, langpair) {
  const url = "https://api.mymemory.translated.net/get?q=" +
    encodeURIComponent(text) + "&langpair=" + langpair;
  const res = await fetch(url);
  if (!res.ok) throw new Error("翻译接口请求失败（HTTP " + res.status + "）");
  const data = await res.json();
  if (data.responseStatus !== 200) throw new Error("翻译接口返回错误：" + data.responseDetails);
  return data.responseData.translatedText;
}

function setText(id, label, text) {
  const el = $(id);
  el.innerHTML = "<h3>" + label + "</h3><p class='text'></p>";
  el.querySelector("p").textContent = text;
}

async function run() {
  const btn = $("run");
  btn.disabled = true;
  $("error").hidden = true;
  $("error").textContent = "";
  $("result").hidden = true;
  try {
    const repo = parseRepo($("repo").value);
    const meta = $("meta");
    meta.textContent = "正在获取 " + repo + " 的简介…";

    const gh = await fetch("https://api.github.com/repos/" + repo);
    if (!gh.ok) throw new Error("GitHub API 请求失败（HTTP " + gh.status + "），请确认仓库存在");
    const info = await gh.json();
    const desc = info.description;
    if (!desc) throw new Error("该仓库没有简介可翻译");
    meta.textContent = repo + "（" + (info.stargazers_count || 0) + " ★）";

    setText("original", "原文（EN）", desc);

    meta.textContent += " — 正在翻译…";
    const [cn, tw] = await Promise.all([
      translate(desc, "en|zh-CN"),
      translate(desc, "en|zh-TW"),
    ]);

    setText("zhcn", "简体中文（zh-CN）", cn);
    setText("zhtw", "繁体中文（zh-TW）", tw);
    $("result").hidden = false;
  } catch (err) {
    $("error").textContent = "出错了：" + err.message;
    $("error").hidden = false;
  } finally {
    btn.disabled = false;
  }
}

$("run").addEventListener("click", run);
$("repo").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
</script>
</body>
</html>
